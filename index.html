<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thought Clouds</title>
<meta name="description" content="A sky of written-out thoughts. Scroll the feed; drift through the months on the timeline." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />

<header class="sky-header">
  <h1 class="site-title">Thought&nbsp;Clouds</h1>
  <p class="site-tagline">A sky full of questions. Tap a cloud to read what's underneath.</p>
</header>

<div class="layout">
  <main id="feed" class="feed" aria-live="polite">
    <!-- month groups + clouds injected by app.js -->
  </main>

  <aside class="timeline" aria-label="Timeline of months">
    <nav id="tl-nav" class="tl-nav">
      <!-- month markers injected by app.js -->
    </nav>
  </aside>
</div>

<p id="empty" class="empty" hidden>The sky is clear — no thoughts yet.</p>

<!-- Reading overlay -->
<div id="overlay" class="overlay" hidden>
  <div class="overlay-backdrop" data-close></div>
  <article class="reader" role="dialog" aria-modal="true" aria-labelledby="reader-title">
    <button class="reader-close" data-close aria-label="Close">&times;</button>
    <div class="reader-meta">
      <span id="reader-date" class="reader-date"></span>
      <span id="reader-tags" class="reader-tags"></span>
    </div>
    <h2 id="reader-title" class="reader-title"></h2>
    <div id="reader-body" class="reader-body"></div>
  </article>
</div>

<script src="thoughts.js"></script>
<script src="app.js"></script>
